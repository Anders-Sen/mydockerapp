name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
        working-directory: ./app

      - run: npm run lint
        working-directory: ./app

      - run: npm test
        working-directory: ./app

      - run: npm run build
        working-directory: ./app
      
      - run: echo "CI Success"